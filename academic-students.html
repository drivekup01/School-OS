<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทะเบียนนักเรียน · วิชาการ</title><link rel="stylesheet" href="https://drivekup01.github.io/School-Portal/shared/school-ui.css?v=20261030-unified1"><link rel="stylesheet" href="css/grades.css?v=20261107-academic1"><script type="module" src="js/academic-students.js?v=20261107-academic1"></script></head><body><section id="gate" class="grade-gate"><p id="gateMessage">กำลังตรวจสิทธิ์…</p><button id="login">เข้าสู่ระบบ</button></section><div id="workspace" hidden><header class="grade-header"><a href="https://drivekup01.github.io/School-Portal/staff/">← ระบบครูและบุคลากร</a></header><main><div class="grade-title"><h1>ทะเบียนนักเรียน</h1><p id="scope"></p></div><p id="status" class="grade-status" role="status"></p><section class="grade-panel"><label>ห้องเรียนภาคปัจจุบัน<select id="classId"></select></label><button id="reload">โหลดรายชื่อ</button><div class="grade-scroll"><table><thead><tr><th>เลขที่</th><th>รหัสนักเรียน</th><th>ชื่อ–นามสกุล</th><th>สถานะ</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="grade-panel"><h2 id="formTitle">เพิ่มนักเรียนใหม่</h2><form id="form" class="grade-subjects"><label>รหัสนักเรียน<input id="code" required pattern="[0-9]{1,20}" maxlength="20"></label><label>ชื่อ–นามสกุล<input id="name" required maxlength="160"></label><label>เลขที่<input id="number" type="number" required min="1" max="1000"></label><label id="activeField" hidden><input id="active" type="checkbox" checked>ใช้งานในทะเบียน</label><button id="save" class="primary">เพิ่มนักเรียน</button><button id="cancel" type="button" hidden>ยกเลิกแก้ไข</button></form></section></main></div></body></html>
